<!DOCTYPE html>
<html lang="ko" data-hc="off">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>국제 장애인신문 — 모두가 읽고, 보고, 듣는 뉴스</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{ --scale:1;
    --bg:#f3f2ee; --surface:#ffffff; --ink:#15130f; --muted:#6b655b;
    --navy:#11335f; --red:#b32430; --line:#e2ddd2; --soft:#eef2f8;
    --serif:'Gowun Batang', serif; --sans:'Noto Sans KR', sans-serif; }
  html[data-hc="on"]{ --bg:#000; --surface:#000; --ink:#fff; --muted:#ffe23d;
    --navy:#ffe23d; --red:#ffe23d; --line:#fff; --soft:#1c1c00; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:calc(1rem*var(--scale)); line-height:1.6;}
  a{color:inherit; text-decoration:none;}
  button{font-family:var(--sans); cursor:pointer;}
  *:focus-visible{outline:4px solid var(--red); outline-offset:2px; border-radius:3px;}
  .skip{position:absolute; left:-9999px; top:0; background:var(--red); color:#fff; padding:10px 16px; z-index:50; font-weight:700;}
  .skip:focus{left:8px; top:8px;}

  .util{background:var(--navy); color:#fff; font-size:.84em;}
  html[data-hc="on"] .util{color:#000;}
  .util .in{max-width:1080px; margin:0 auto; padding:7px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .util .right{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .util button{border:1.5px solid currentColor; background:transparent; color:inherit; font-weight:700; border-radius:7px; padding:4px 10px; font-size:1em;}
  .util button[aria-pressed="true"]{background:#fff; color:var(--navy);}
  html[data-hc="on"] .util button[aria-pressed="true"]{color:#000;}
  .util #listenBtn{background:#fff; color:var(--navy);}
  html[data-hc="on"] .util #listenBtn{background:#fff; color:#000;}

  header.top{background:var(--surface); border-bottom:3px solid var(--ink);}
  .brandrow{max-width:1080px; margin:0 auto; padding:22px 20px 14px;}
  .brand h1{font-family:var(--serif); font-weight:700; font-size:2.8em; margin:0; line-height:1; cursor:pointer;}
  .brand .slogan{color:var(--navy); font-weight:700; font-size:.95em; margin-top:6px;}
  nav.sections{max-width:1080px; margin:0 auto; padding:0 12px;}
  nav.sections ul{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap;}
  nav.sections a{display:block; padding:13px 16px; font-weight:700; font-size:1.02em; border-bottom:3px solid transparent;}
  nav.sections a[aria-current="true"], nav.sections a:hover{color:var(--red); border-bottom-color:var(--red);}

  .page{max-width:1080px; margin:0 auto; padding:0 20px 90px;}

  .ad{border:1px solid var(--line); background:var(--surface); border-radius:12px; overflow:hidden; position:relative;}
  .ad .lab{position:absolute; top:8px; right:10px; font-size:.7em; font-weight:700; color:var(--muted); background:var(--bg); padding:2px 7px; border-radius:5px; border:1px solid var(--line);}
  .ad.leader{display:flex; align-items:center; gap:18px; padding:18px 22px; margin:20px 0;}
  .ad.leader .art{width:120px; height:64px; border-radius:8px; flex:none;}
  .ad.leader .txt b{font-size:1.1em;} .ad.leader .txt div{color:var(--muted); font-size:.92em; margin-top:3px;}
  .ad.rect{padding:18px; margin-bottom:20px;}
  .ad.rect .art{width:100%; height:150px; border-radius:8px; margin-bottom:12px;}
  .ad.rect b{font-size:1.05em;} .ad.rect div.d{color:var(--muted); font-size:.9em; margin-top:4px;}

  .sectitle{font-family:var(--serif); font-size:1.6em; font-weight:700; padding:22px 0 6px; border-bottom:2px solid var(--ink); margin-bottom:6px;}

  .hero{display:grid; grid-template-columns:1.4fr 1fr; gap:26px; padding:26px 0 8px; border-bottom:1px solid var(--line); cursor:pointer;}
  .hero .photo{width:100%; aspect-ratio:16/10; border-radius:14px; background-size:cover; background-position:center;}
  .hero .lead .cat{color:var(--red); font-weight:700; font-size:.9em;}
  .hero .lead h2{font-family:var(--serif); font-weight:700; font-size:2.3em; line-height:1.25; margin:8px 0 12px;}
  .hero .lead p{font-size:1.12em; line-height:1.7; margin:0 0 12px;}
  .hero .lead .meta{color:var(--muted); font-size:.9em;}
  .hero.reading, .card.reading{box-shadow:0 0 0 3px var(--red); border-radius:14px;}

  .grid{display:grid; grid-template-columns:1fr 320px; gap:34px; padding-top:24px;}
  .stories{display:flex; flex-direction:column; gap:22px;}
  .card{display:grid; grid-template-columns:160px 1fr; gap:16px; padding:6px; border-radius:12px; cursor:pointer;}
  .card{border-bottom:1px solid var(--line); border-radius:0; padding:0 0 22px;}
  .card .photo{width:160px; height:104px; border-radius:10px; background-size:cover; background-position:center;}
  .card .cat{color:var(--red); font-weight:700; font-size:.82em;}
  .card h3{font-family:var(--serif); font-weight:700; font-size:1.32em; line-height:1.35; margin:5px 0 7px;}
  .card p{margin:0; color:var(--muted); font-size:.98em; line-height:1.6;}
  .card .src{margin-top:7px; font-size:.82em; color:var(--muted);}
  .empty{color:var(--muted); padding:30px 0;}

  aside .box{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:20px;}
  aside h4{margin:0 0 14px; font-size:1.15em; border-left:5px solid var(--red); padding-left:10px;}
  aside ol{margin:0; padding:0; list-style:none; counter-reset:r;}
  aside ol li{counter-increment:r; display:flex; gap:12px; padding:10px 0; border-top:1px solid var(--line); cursor:pointer;}
  aside ol li:first-child{border-top:none;}
  aside ol li::before{content:counter(r); font-family:var(--serif); font-weight:700; color:var(--red); font-size:1.2em; min-width:20px;}
  aside ol li span.h{font-weight:500; line-height:1.4;}

  .listen-card{background:var(--navy); color:#fff; border:none;}
  html[data-hc="on"] .listen-card{color:#000; border:2px solid #fff;}
  .listen-card h4{color:#fff; border-left-color:#fff;}
  html[data-hc="on"] .listen-card h4{color:#000; border-left-color:#000;}
  .listen-card p{font-size:.95em; opacity:.95; margin:0 0 14px; line-height:1.6;}
  .listen-card button{display:block; width:100%; text-align:center; background:#fff; color:var(--navy); font-weight:700; padding:13px; border-radius:10px; font-size:1.05em; border:none;}
  html[data-hc="on"] .listen-card button{color:#000;}

  #detail{padding-top:18px;}
  #detail .back{border:2px solid var(--ink); background:var(--surface); color:var(--ink); font-weight:700; border-radius:10px; padding:9px 16px; font-size:1em; margin-bottom:18px;}
  #detail .cat{color:var(--red); font-weight:700;}
  #detail h2{font-family:var(--serif); font-weight:700; font-size:2.2em; line-height:1.3; margin:8px 0 14px; max-width:760px;}
  #detail .dmeta{color:var(--muted); font-size:.92em; margin-bottom:18px; display:flex; gap:16px; flex-wrap:wrap; align-items:center;}
  #detail .dmeta a{color:var(--navy); font-weight:700; text-decoration:underline;}
  #detail .dmeta button{border:2px solid var(--navy); background:var(--soft); color:var(--navy); font-weight:700; border-radius:9px; padding:7px 14px; font-size:.95em;}
  html[data-hc="on"] #detail .dmeta button{color:#000;}
  #detail .dphoto{width:100%; max-width:760px; aspect-ratio:16/9; border-radius:14px; margin-bottom:8px; background-size:cover; background-position:center;}
  #detail .cap{color:var(--muted); font-size:.82em; margin-bottom:20px;}
  #detail .dbody{max-width:760px;} #detail .dbody p{font-size:1.18em; line-height:1.85; margin:0 0 16px;}

  .playbar{position:fixed; left:0; right:0; bottom:0; background:var(--navy); color:#fff; display:none; align-items:center; gap:14px; padding:13px 20px; z-index:60; font-weight:700;}
  html[data-hc="on"] .playbar{color:#000; border-top:2px solid #fff;}
  .playbar.on{display:flex;}
  .playbar .stop{margin-left:auto; border:2px solid currentColor; background:transparent; color:inherit; font-weight:700; border-radius:9px; padding:8px 18px; cursor:pointer; font-size:1em;}

  footer{background:var(--surface); border-top:3px solid var(--ink); margin-top:30px;}
  footer .in{max-width:1080px; margin:0 auto; padding:26px 20px; color:var(--muted); font-size:.86em; line-height:1.8;}
  footer .in b{color:var(--ink);}

  @media (max-width:820px){
    .hero{grid-template-columns:1fr;} .hero .lead h2{font-size:1.8em;}
    .grid{grid-template-columns:1fr;}
    .card{grid-template-columns:120px 1fr;} .card .photo{width:120px; height:80px;}
    .brand h1{font-size:2em;} #detail h2{font-size:1.7em;}
  }
  @media (max-width:480px){ .card{grid-template-columns:1fr;} .card .photo{width:100%; height:170px;} }
</style>
</head>
<body>
<a class="skip" href="#main">본문 바로가기</a>

<div class="util">
  <div class="in">
    <span id="today"></span>
    <span class="right">
      <span>글자</span>
      <button data-scale="1" aria-pressed="true">가</button>
      <button data-scale="1.25" aria-pressed="false">가＋</button>
      <button id="hcBtn" aria-pressed="false">고대비</button>
      <button id="listenBtn">🔊 음성으로 듣기</button>
    </span>
  </div>
</div>

<header class="top">
  <div class="brandrow">
    <div class="brand">
      <h1 id="home">국제 장애인신문</h1>
      <div class="slogan">모두가 읽고, 보고, 듣는 뉴스</div>
    </div>
  </div>
  <nav class="sections" aria-label="섹션"><ul id="nav"></ul></nav>
</header>

<div class="page">
  <div class="ad leader" id="adLeader" aria-label="광고"><span class="lab">광고</span></div>
  <main id="main"></main>
</div>

<div class="playbar" id="playbar" role="status" aria-live="polite">
  <span id="playstatus">🔊 신문을 읽고 있습니다…</span>
  <button class="stop" id="playstop">◼ 멈춤</button>
</div>

<footer>
  <div class="in">
    <div><b>국제 장애인신문</b> · 모두가 읽고, 보고, 듣는 뉴스</div>
    <div id="footReg"></div>
    <div>청소년보호책임자: ○○○ · 고객문의: 000-0000-0000</div>
    <div>기사는 매일 자동 발행됩니다. 외부 기사는 사실을 바탕으로 다시 쓰고 출처를 표기하며, 자체 기사는 AI가 작성합니다.</div>
  </div>
</footer>

<script>
const SAMPLE = {
  regNo: "인터넷신문 등록번호: 인천, 아00000 (예시) · 발행인·편집인: ○○○",
  articles: [
    { id:"lead", type:"curated", category:"복지·장애", source:"장애인문화신문", url:"https://www.cndnews.kr/news/articleView.html?idxno=21271",
      headline:"2026년 장애인 정책 확 바뀐다 — 활동지원 늘고 ‘개인예산제’ 전국 시행",
      dek:"중증장애인 월 활동지원이 258시간으로 늘고, 활동지원의 일부를 현금처럼 쓰는 개인예산제가 올해 전국으로 확대된다.",
      body:"올해부터 장애인 복지제도가 여러 갈래로 바뀐다. 중증장애인의 월 활동지원 시간은 기존 205시간에서 258시간으로 늘고, 시간당 단가도 오른다.\n시범사업이던 ‘개인 예산제’는 올해 본사업으로 전환돼 전국에서 시행된다. 활동지원 급여의 일부를 현금성 예산으로 받아 보조기기나 주거환경 개선 등 필요한 곳에 직접 쓸 수 있다.\n장애인연금은 물가를 반영해 월 최대 43만 9,700원으로 오르고, 장애 인정 유형도 15개에서 16개로 늘어 췌장장애가 새로 포함된다." },
    { id:"politics", type:"curated", category:"정치", source:"선거 보도 종합", url:"#",
      headline:"6·3 지방선거 막 내려 — 국회의원 14곳 재보궐 동시 실시",
      dek:"제8회 전국동시지방선거가 6월 3일 치러졌다. 국회의원 14곳 재보궐선거가 함께 열려 민주화 이후 최대 규모로 기록됐다.",
      body:"제8회 전국동시지방선거가 지난 6월 3일 전국에서 치러졌다.\n이번에는 국회의원 14곳의 재보궐선거가 함께 열렸다. 한꺼번에 비는 의석이 이만큼 많은 것은 민주화 이후 처음으로, 정치적 무게가 크다는 평가가 나온다.\n공석이 된 의석 가운데 다수는 더불어민주당이 갖고 있던 자리였다.\n각 정당은 이번 선거를 앞으로의 정국을 가늠하는 잣대로 보고 있다." },
    { id:"iran", type:"curated", category:"국제", source:"NPR", url:"https://www.npr.org/sections/world/",
      headline:"중동 긴장 고조 — 호르무즈 해협 물류 사실상 멈춰",
      dek:"이란을 둘러싼 무력 충돌이 이어지며, 세계 원유의 길목인 호르무즈 해협의 선박 운항이 사실상 멈췄다.",
      body:"이란을 둘러싼 무력 충돌이 이어지면서 중동의 긴장이 높아지고 있다.\n특히 세계 원유 수송의 길목인 호르무즈 해협의 선박 운항이 사실상 멈추면서, 기업들은 원유와 비료, 생활용품을 옮길 대체 경로를 찾느라 분주하다.\n미국은 이란을 상대로 협상 압박을 강화하고 있다.\n물류 차질이 길어지면 국제 유가와 물가에 영향을 줄 수 있다는 우려가 나온다." },
    { id:"col", type:"column", category:"사설", author:"AI 논설위원",
      headline:"「국제 장애인신문」이 첫 호를 냅니다 — 모두가 읽고, 보고, 듣는 뉴스로",
      dek:"정보는 권리입니다. 보는 사람, 듣는 사람, 손이 불편한 사람 모두가 같은 뉴스를 같은 날 누리도록 하겠습니다.",
      body:"정보는 모두의 권리입니다. 그러나 작은 글씨와 복잡한 문장, 소리 없는 화면은 누군가에게 여전히 높은 벽입니다.\n국제 장애인신문은 장애 관련 소식뿐 아니라 사회와 세계에서 일어나는 일을 모두 다룹니다. 장애인도 세상 전체를 알 권리가 있기 때문입니다.\n모든 뉴스를 쉬운 말로 다시 쓰고, 큰 글씨로 보여 주며, 소리 내어 읽어 드립니다. 사진에는 설명을 붙입니다.\n오늘 첫 호를 시작으로, 한 사람이라도 더 세상과 이어지길 바랍니다." },
    { id:"subway", type:"curated", category:"사회", source:"보안뉴스", url:"https://m.boannews.com/html/detail.html?idx=125078",
      headline:"버튼 안 눌러도 열린다 — 휠체어 자동 인식 엘리베이터",
      dek:"CCTV가 휠체어 이용자를 알아보고 엘리베이터를 자동으로 부르는 기술이 서울 지하철에 도입됐다.",
      body:"휠체어나 전동스쿠터를 탄 교통약자가 버튼을 누르지 않아도, 카메라가 이를 알아보고 엘리베이터를 자동으로 불러 주는 기술이 서울 지하철에 도입됐다.\n좁은 경사로에서 버튼을 누르기 어렵다는 이용자 민원에서 시작된 개선이다.\n앞서 일부 역에서 시범 운영해 좋은 반응을 얻은 뒤 여러 역으로 확대됐다.\n작은 기술 하나가 이동의 문턱을 낮춘 사례로 꼽힌다." },
    { id:"econ2", type:"curated", category:"경제", source:"재정경제부", url:"https://www.mofe.go.kr/",
      headline:"5월 물가 발표·OECD 전망 — 유가 불안에 촉각",
      dek:"정부가 5월 소비자물가 동향을 내놓고 OECD도 6월 경제전망을 발표했다. 중동발 유가 불안이 새 변수로 떠올랐다.",
      body:"정부가 5월 소비자물가 동향을 발표했고, 경제협력개발기구(OECD)도 6월 세계 경제전망을 내놨다.\n정부는 공급망 안정과 물가 관리에 힘을 쏟고 있다.\n다만 중동 정세로 인한 국제 유가 불안이 새로운 변수로 떠올랐다.\n유가가 흔들리면 장바구니 물가에도 영향을 줄 수 있어 당국이 상황을 주시하고 있다." },
    { id:"stat", type:"curated", category:"복지·장애", source:"보건복지부", url:"#",
      headline:"등록장애인 262만 명 시대 — 10명 중 6명이 65세 이상",
      dek:"지난해 말 등록장애인은 262만여 명으로 인구의 5.1%. 고령 장애인 비율이 꾸준히 높아지고 있다.",
      body:"보건복지부 집계에 따르면 지난해 말 기준 등록장애인은 262만 7천여 명으로, 전체 인구의 5.1% 수준이다. 한 해 전보다는 소폭 줄었다.\n유형별로는 지체장애가 전체의 42.4%로 가장 많았고, 청각장애와 시각장애가 뒤를 이었다.\n특히 65세 이상 고령 장애인이 전체의 56.9%에 달해, 2015년 42.3%에서 10년 새 크게 높아졌다.\n복지 당국은 고령화 흐름에 맞춰 돌봄과 의료 서비스 수요에 대응하겠다고 밝혔다." },
    { id:"eu", type:"curated", category:"국제", source:"UNRIC·유럽장애포럼", url:"https://unric.org/en/building-an-accessible-future-for-all-ai-and-the-inclusion-of-persons-with-disabilities/",

      body:"올해 복지·고용 분야 예산이 늘었다. 보건복지부 총지출은 137조 원대로 지난해보다 9.7% 증가했다.\n저소득층 생활 안정을 위해 기준 중위소득이 역대 최고 수준으로 올랐고, 생계급여도 인상됐다.\n장애인 고용을 늘리기 위한 고용장려금은 4,014억 원으로 지난해보다 293억 원 늘었다.\n장애인의 소득과 일자리를 함께 떠받치려는 취지다." },
    { id:"tech", type:"curated", category:"국제", source:"Level Access", url:"https://www.levelaccess.com/blog/ai-and-assistive-tech-key-advancements-in-accessibility/",
      headline:"사진을 읽어주는 AI — 시각장애인의 일상을 바꾸다",

      body:"카메라로 주변을 비추면 장면을 설명하고 글자를 소리 내어 읽어 주는 AI 보조 기술이 빠르게 발전하고 있다.\n시각장애인을 위한 무료 앱들이 사물 인식과 글자 읽기, 장면 설명 기능을 제공한다.\n스마트폰 운영체제 자체에도 사진 내용을 설명해 주는 기능이 들어가고 있다.\n전문가들은 이런 기술이 더 정확하고 개인 맞춤형으로 진화하고 있다고 본다." },

      body:"정부가 올해 장애인 공공일자리를 지난해보다 2,300개 늘려 3만 5,846명 규모로 운영한다.\n일자리는 전일제·시간제의 일반형, 장애 특성을 고려한 복지형, 시각장애인 안마사 파견 등 특화형으로 나뉜다.\n복지형 일자리가 가장 많이 늘어 1,600개가 추가됐다.\n참여자 모집은 지방자치단체별로 진행된다." },

  ads: {
    leader: { advertiser:"한울복지재단", text:"장애인 활동지원, 가까운 주민센터에서 도와드립니다." },
    rect:   { advertiser:"베리어프리 가전", text:"음성으로 켜고 끄는 가전, 모두를 위한 기술." }

const SECTIONS = ["전체","복지·장애","사회","정치","국제","경제","문화","독자 기사"];
const CAT_COLORS = {
  "사설":["#11335f","#2b5a9e"], "복지·장애":["#0f6f5c","#21a98c"], "사회":["#1d4f9e","#3a78d6"],
  "정치":["#4a4f5e","#7c8398"], "국제":["#7a3a18","#c9772f"], "경제":["#9a5b00","#d99417"],
  "문화":["#5e3a8c","#9163d6"], "독자 기사":["#a3262f","#d65560"]
};
function grad(cat){ const c = CAT_COLORS[cat] || ["#555","#888"]; return `linear-gradient(135deg, ${c[0]}, ${c[1]})`; }
function photoStyle(a){
  const img = a && a.image ? a.image : `https://picsum.photos/seed/idn_${a?a.id:'x'}/800/500`;
  return `background-image:url('${img}'), ${grad(a?a.category:'사회')};`;
}
function find(id){ return EDITION.articles.find(x=>x.id===id); }

let EDITION = SAMPLE;
let section = "전체";

function renderNav(){
  document.getElementById("nav").innerHTML = SECTIONS.map(s =>
    `<li><a href="#" data-sec="${s}" ${s===section?'aria-current="true"':''}>${s}</a></li>`).join("");
}

function listHTML(){
  const arts = EDITION.articles;
  const all = section === "전체";
  const visible = all ? arts : arts.filter(a => a.category === section);
  const lead = all ? visible[0] : null;
  const cards = all ? visible.slice(1) : visible;

  const heroHTML = lead ? `
    <section class="hero" data-id="${lead.id}" role="link" tabindex="0" aria-label="머리기사: ${lead.headline}">
      <div class="photo" style="${photoStyle(lead)}" role="img" aria-label="${lead.category} 기사 대표 이미지"></div>
      <div class="lead">
        <div class="cat">${lead.category}</div>
        <h2>${lead.headline}</h2>
        <p>${lead.dek||""}</p>
        <div class="meta">${lead.source?("출처: "+lead.source):(lead.author||"")}</div>
      </div>
    </section>` : `<div class="sectitle">${section}</div>`;

  const cardsHTML = cards.length ? cards.map(a => `
    <article class="card" data-id="${a.id}" role="link" tabindex="0" aria-label="${a.headline}">
      <div class="photo" style="${photoStyle(a)}" role="img" aria-label="${a.category} 기사 이미지"></div>
      <div>
        <div class="cat">${a.category}</div>
        <h3>${a.headline}</h3>
        <p>${a.dek||""}</p>
        <div class="src">${a.source?("출처: "+a.source):(a.author||"")}</div>
      </div>
    </article>`).join("") : `<div class="empty">이 섹션의 기사가 아직 없습니다.</div>`;

  const R = EDITION.ads && EDITION.ads.rect;
  return `
    ${heroHTML}
    <div class="grid">
      <div class="stories" aria-label="기사 목록">${cardsHTML}</div>
      <aside aria-label="추가 정보">
        <div class="box"><h4>많이 본 기사</h4>
          <ol>${arts.slice(0,5).map(a=>`<li data-id="${a.id}" role="link" tabindex="0"><span class="h">${a.headline}</span></li>`).join("")}</ol>
        </div>
        ${R?`<div class="ad rect"><span class="lab">광고</span><div class="art" style="background:${grad('복지·장애')}"></div><b>${R.text}</b><div class="d">${R.advertiser}</div></div>`:''}
        <div class="box listen-card"><h4>잘 안 보이시나요?</h4>
          <p>오늘 신문 전체를 처음부터 끝까지 읽어드립니다. 시각장애인·저시력 독자를 위한 기능이에요.</p>
          <button data-listen-all>🔊 신문 전체 듣기</button></div>
      </aside>
    </div>`;
}

function detailHTML(a){
  const orig = a.url && a.url!=="#" ? ` · <a href="${a.url}" target="_blank" rel="noreferrer">원문 보기 ↗</a>` : "";
  return `
    <article id="detail">
      <button class="back" id="back">← 목록으로</button>
      <div class="cat">${a.category}</div>
      <h2>${a.headline}</h2>
      <div class="dmeta"><span>${a.source?("출처: "+a.source):(a.author||"")}${orig}</span>
        <button data-listen="${a.id}">🔊 이 기사 듣기</button></div>
      <div class="dphoto" style="${photoStyle(a)}" role="img" aria-label="${a.category} 관련 이미지"></div>
      <div class="cap">${a.category} 관련 이미지 (예시)</div>
      <div class="dbody">${(a.body||a.dek||"").split("\n").map(p=>`<p>${p}</p>`).join("")}</div>
    </article>`;
}

function showList(){ stopRead(); document.getElementById("main").innerHTML = listHTML(); window.scrollTo(0,0); }
function showDetail(id){ stopRead(); const a=find(id); if(!a) return; document.getElementById("main").innerHTML = detailHTML(a); window.scrollTo(0,0); }

function renderTop(){
  document.getElementById("today").textContent =
    new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
  document.getElementById("footReg").textContent = EDITION.regNo || "";
  const L = EDITION.ads && EDITION.ads.leader;
  document.getElementById("adLeader").innerHTML = L
    ? `<span class="lab">광고</span><div class="art" style="background:${grad('경제')}"></div><div class="txt"><b>${L.text}</b><div>${L.advertiser}</div></div>`
    : `<span class="lab">광고</span>`;
}

/* ───── 음성 읽기 (그 자리에서 바로) ───── */
let segs=[], idx=0, playing=false;
const synthOK = 'speechSynthesis' in window;
function splitSentences(t){ return (t||"").split(/\n+/).flatMap(l=>l.match(/[^.!?。…]+[.!?。…]?/g)||[]).map(s=>s.trim()).filter(Boolean); }
function setReading(aid){
  document.querySelectorAll(".hero,[data-id]").forEach(el=>{
    if (el.classList) el.classList.toggle("reading", el.dataset && el.dataset.id===aid);
  });
}
function step(){
  if (idx>=segs.length){ stopRead(); return; }
  const {text,aid}=segs[idx]; setReading(aid);
  const u=new SpeechSynthesisUtterance(text); u.lang="ko-KR"; u.rate=1;
  u.onend=()=>{idx++; step();}; u.onerror=()=>{idx++; step();};
  speechSynthesis.speak(u);
}
function startQueue(list){
  if (!synthOK || !list.length) return;
  speechSynthesis.cancel(); segs=list; idx=0; playing=true;
  document.getElementById("playbar").classList.add("on");
  step();
}
function playAll(){
  const a = EDITION.articles;
  const list = splitSentences("국제 장애인신문, 오늘자 신문입니다.").map(s=>({text:s,aid:"intro"}));
  a.forEach(x => splitSentences(`${x.headline}. ${x.body||x.dek}`).forEach(s=>list.push({text:s,aid:x.id})));
  if (EDITION.ads && EDITION.ads.leader) splitSentences(`광고. ${EDITION.ads.leader.text}`).forEach(s=>list.push({text:s,aid:"ad"}));
  startQueue(list);
}
function playOne(id){ const x=find(id); if(!x) return; startQueue(splitSentences(`${x.headline}. ${x.body||x.dek}`).map(s=>({text:s,aid:id}))); }
function stopRead(){ if(synthOK) speechSynthesis.cancel(); playing=false; segs=[]; idx=0; const pb=document.getElementById("playbar"); if(pb) pb.classList.remove("on"); setReading(null); }

/* ───── 이벤트 ───── */
document.addEventListener("click", (e)=>{
  if (e.target.id==="playstop"){ stopRead(); return; }
  if (e.target.id==="listenBtn" || e.target.closest("[data-listen-all]")){ playing ? stopRead() : playAll(); return; }
  const lis = e.target.closest("[data-listen]");
  if (lis){ playOne(lis.dataset.listen); return; }
  const sec = e.target.closest("[data-sec]");
  if (sec){ e.preventDefault(); section = sec.dataset.sec; renderNav(); showList(); return; }
  if (e.target.id === "back"){ showList(); return; }
  if (e.target.id === "home"){ section="전체"; renderNav(); showList(); return; }
  const item = e.target.closest("[data-id]");
  if (item){ showDetail(item.dataset.id); return; }
});
document.addEventListener("keydown", (e)=>{
  if (e.key!=="Enter" && e.key!==" ") return;
  const item = e.target.closest("[data-id]");
  if (item && e.target.getAttribute("role")==="link"){ e.preventDefault(); showDetail(item.dataset.id); }
});

document.querySelectorAll("[data-scale]").forEach(b => b.onclick = ()=>{
  document.documentElement.style.setProperty("--scale", b.dataset.scale);
  document.querySelectorAll("[data-scale]").forEach(x=>x.setAttribute("aria-pressed", x===b));
});
document.getElementById("hcBtn").onclick = function(){
  const on = document.documentElement.getAttribute("data-hc")==="on";
  document.documentElement.setAttribute("data-hc", on?"off":"on");
  this.setAttribute("aria-pressed", String(!on));
};

(async function(){
  try{ const r = await fetch("./articles.json",{cache:"no-store"}); if(r.ok){const d=await r.json(); if(d&&d.articles) EDITION=d;} }
  catch(e){}
  renderNav(); renderTop(); showList();
})();
</script>
</body>
