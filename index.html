<!DOCTYPE html>
<html lang="ko" data-hc="off">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>국제 장애인신문 — 모두가 읽고, 보고, 듣는 뉴스</title>
<meta name="description" content="국제 장애인신문 — 큰 글씨, 고대비, 음성 듣기로 모두가 읽는 종합 인터넷신문" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  /* ───── 기본 색 (명도 대비 7:1 이상) ───── */
  :root{
    --scale:1;
    --bg:#ffffff; --surface:#ffffff; --panel:#f4f6f9;
    --ink:#111418; --muted:#3f4652; --line:#c9cfd8;
    --primary:#0a3a8c; --primary-ink:#ffffff; --accent:#b0122a;
    --focus:#ffbf00;
    --sans:'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --serif:'Gowun Batang', serif;
  }
  /* 고대비: 검정 바탕 + 노란 글씨 */
  html[data-hc="on"]{
    --bg:#000; --surface:#000; --panel:#000;
    --ink:#fff; --muted:#ffe600; --line:#fff;
    --primary:#ffe600; --primary-ink:#000; --accent:#ffe600; --focus:#00e5ff;
  }
  *{box-sizing:border-box;}
  html{font-size:calc(20px * var(--scale));}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
       font-size:1rem; line-height:1.8; word-break:keep-all; overflow-wrap:break-word;}
  a{color:inherit;}
  button{font-family:inherit; font-size:inherit; cursor:pointer;}
  *:focus-visible{outline:5px solid var(--focus); outline-offset:3px; border-radius:6px;}
  @media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto !important; transition:none !important;} }
  .wrap{max-width:960px; margin:0 auto; padding:0 18px;}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
  .skip{position:absolute; left:-9999px; top:0; background:var(--accent); color:#fff; padding:14px 20px; z-index:99; font-weight:900;}
  .skip:focus{left:10px; top:10px;}

  /* ───── 큰 버튼 공통 (손가락·마우스 모두 누르기 쉽게, 최소 56px) ───── */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:.4em;
       min-height:56px; padding:.45em 1em; border-radius:12px; font-weight:700; line-height:1.3;
       border:3px solid var(--primary); background:var(--surface); color:var(--primary); text-decoration:none;}
  .btn.solid{background:var(--primary); color:var(--primary-ink);}
  .btn[aria-pressed="true"]{background:var(--primary); color:var(--primary-ink);}
  .btn:hover{filter:brightness(.95);}

  /* ───── 맨 위 도구 막대 ───── */
  .tools{background:var(--panel); border-bottom:2px solid var(--line);}
  .tools .wrap{display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding-top:12px; padding-bottom:12px;}
  .tools .label{font-weight:700; margin-right:2px;}
  .tools .grp{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .tools .grp + .grp{margin-left:auto;}
  .tools .btn{min-height:52px; font-size:.95rem;}

  /* ───── 제호 ───── */
  header.mast{border-bottom:6px solid var(--ink);}
  header.mast .wrap{padding-top:22px; padding-bottom:16px; display:flex; flex-wrap:wrap; align-items:flex-end; gap:6px 20px;}
  .mast h1{margin:0; font-family:var(--serif); font-size:2.6rem; line-height:1.1; letter-spacing:-.01em;}
  .mast h1 a{text-decoration:none;}
  .mast .slogan{font-weight:700; color:var(--primary); font-size:1.05rem;}
  .mast .date{margin-left:auto; font-weight:700; font-size:1.05rem;}

  /* ───── 섹션 고르기 ───── */
  nav.secs{border-bottom:2px solid var(--line); background:var(--surface);}
  nav.secs ul{list-style:none; margin:0; padding:14px 0; display:flex; flex-wrap:wrap; gap:10px;}
  nav.secs .btn{min-height:52px; font-size:1rem; padding:.35em .9em; border-width:2px;}
  nav.secs .btn[aria-current="page"]{background:var(--primary); color:var(--primary-ink);}

  main{padding:20px 0 140px;}

  /* ───── 오늘 신문 안내 / 전체 듣기 ───── */
  .listenall{display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin:6px 0 26px; padding:18px 20px;
             border:3px solid var(--primary); border-radius:16px; background:var(--panel);}
  .listenall p{margin:0; flex:1 1 300px; font-weight:500;}
  .listenall .btn{font-size:1.1rem; min-height:62px; padding:.5em 1.3em;}

  /* ───── 분야 표시 (색 + 글자, 색만으로 구분하지 않음) ───── */
  .tag{display:inline-block; font-weight:900; font-size:.9rem; padding:.15em .7em; border-radius:999px;
       color:#fff; background:var(--c, #333); letter-spacing:.02em;}
  html[data-hc="on"] .tag{background:#000; color:#ffe600; border:2px solid #ffe600;}
  .num{font-weight:900; color:var(--muted); font-size:.95rem;}

  /* ───── 머리기사 ───── */
  .lead{border:4px solid var(--ink); border-radius:18px; padding:24px 24px 22px; margin-bottom:30px; position:relative;}
  .lead::before{content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--c,#333); border-radius:13px 0 0 13px;}
  html[data-hc="on"] .lead::before{background:#ffe600;}
  .lead .inner{padding-left:12px;}
  .lead .kicker{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:8px;}
  .lead .kicker b{font-weight:900; color:var(--accent);}
  .lead h2{margin:0 0 12px; font-size:1.9rem; line-height:1.35; font-weight:900;}
  .lead h2 a{text-decoration:none;} .lead h2 a:hover{text-decoration:underline; text-decoration-thickness:3px;}
  .lead .dek{margin:0 0 16px; font-size:1.15rem;}
  .src{color:var(--muted); font-size:.9rem; margin-bottom:14px;}
  .acts{display:flex; flex-wrap:wrap; gap:10px;}

  /* ───── 기사 목록 (한 줄에 한 기사) ───── */
  .list{list-style:none; margin:0; padding:0;}
  .item{border-top:2px solid var(--line); padding:22px 0 24px 22px; position:relative;}
  .item::before{content:""; position:absolute; left:0; top:24px; bottom:26px; width:8px; background:var(--c,#333); border-radius:4px;}
  html[data-hc="on"] .item::before{background:#ffe600;}
  .item .kicker{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:6px;}
  .item h3{margin:0 0 8px; font-size:1.4rem; line-height:1.4; font-weight:900;}
  .item h3 a{text-decoration:none;} .item h3 a:hover{text-decoration:underline; text-decoration-thickness:3px;}
  .item .dek{margin:0 0 10px;}
  .item.column{background:var(--panel); border-radius:14px; border:2px solid var(--line); padding:22px 22px 24px 34px; margin:10px 0 18px;}
  .item.column::before{left:12px; top:22px; bottom:22px;}
  .reading{outline:5px solid var(--accent); outline-offset:6px; border-radius:10px;}

  /* ───── 광고 (광고임을 분명히) ───── */
  .ad{border:2px dashed var(--line); border-radius:14px; padding:16px 18px; margin:22px 0; background:var(--surface);}
  .ad .lab{display:inline-block; font-weight:900; font-size:.8rem; border:2px solid var(--muted); color:var(--muted); border-radius:6px; padding:0 .5em; margin-bottom:6px;}
  .ad b{display:block; font-size:1.05rem;} .ad span.who{color:var(--muted); font-size:.9rem;}

  .empty{padding:30px 0; font-size:1.1rem;}

  /* ───── 사진 (자료 사진 표시 + 저작자 표시) ───── */
  figure.ph{margin:0 0 14px;}
  figure.ph img{display:block; width:100%; height:auto; aspect-ratio:16/9; object-fit:cover; border-radius:12px; background:var(--panel); border:2px solid var(--line);}
  figure.ph figcaption{font-size:.78rem; color:var(--muted); line-height:1.5; margin-top:5px;}
  figure.ph figcaption a{color:inherit;}
  .lead .grid{display:grid; grid-template-columns:1fr 1fr; gap:22px; align-items:start;}
  .lead .grid.noimg{grid-template-columns:1fr;}
  .item .grid{display:grid; grid-template-columns:220px 1fr; gap:18px; align-items:start;}
  .item .grid.noimg{grid-template-columns:1fr;}
  .item figure.ph img{aspect-ratio:4/3;}
  #detail figure.ph{margin:4px 0 22px;}
  #detail figure.ph figcaption{font-size:.85rem;}
  @media (max-width:820px){ .lead .grid{grid-template-columns:1fr;} .item .grid{grid-template-columns:1fr;} .item figure.ph img{aspect-ratio:16/9;} }

  /* ───── 기사 본문 ───── */
  #detail{max-width:40em;}
  #detail .top{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:22px;}
  #detail .kicker{display:flex; gap:10px; align-items:center; margin-bottom:8px; flex-wrap:wrap;}
  #detail h2{font-size:2rem; line-height:1.35; margin:0 0 14px; font-weight:900;}
  #detail .dek{font-size:1.15rem; font-weight:500; padding:14px 18px; border-left:8px solid var(--c,#333); background:var(--panel); border-radius:0 12px 12px 0; margin:0 0 22px;}
  html[data-hc="on"] #detail .dek{border-left-color:#ffe600;}
  #detail .body p{font-size:1.15rem; line-height:1.95; margin:0 0 1.1em;}
  #detail .orig{margin:26px 0; font-size:.95rem; color:var(--muted);}
  #detail .orig a{color:var(--primary); font-weight:700; text-decoration-thickness:2px;}
  #detail .pager{display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; border-top:3px solid var(--ink); padding-top:20px; margin-top:30px;}
  #detail .pager .btn{flex:1 1 240px; justify-content:flex-start; text-align:left;}

  /* ───── 음성 재생 막대 ───── */
  .playbar{position:fixed; left:0; right:0; bottom:0; z-index:80; display:none; background:var(--primary); color:var(--primary-ink);
           border-top:4px solid var(--ink);}
  .playbar.on{display:block;}
  .playbar .wrap{display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding-top:12px; padding-bottom:12px;}
  .playbar .now{flex:1 1 260px; font-weight:700;}
  .playbar .btn{border-color:var(--primary-ink); background:transparent; color:var(--primary-ink); min-height:52px;}
  .playbar .btn.stop{background:var(--primary-ink); color:var(--primary);}

  /* ───── 첫 화면 팝업: 어디를 눌러도 전체 듣기, 아래 ✕로 닫기 ───── */
  .pop{position:fixed; inset:0; z-index:100; display:none; flex-direction:column; align-items:center; justify-content:center;
       gap:18px; padding:20px; background:rgba(0,0,0,.72); cursor:pointer;}
  .pop.on{display:flex;}
  .pop .play{width:min(640px,100%); min-height:min(62vh,520px); border:6px solid #fff; border-radius:28px;
       background:var(--primary); color:var(--primary-ink); display:flex; flex-direction:column; align-items:center; justify-content:center;
       gap:14px; padding:30px 24px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.4);}
  html[data-hc="on"] .pop .play{border-color:#ffe600;}
  .pop .play .ic{font-size:5.5rem; line-height:1;}
  .pop .play .t1{font-size:2.3rem; font-weight:900; line-height:1.25;}
  .pop .play .t2{font-size:1.2rem; font-weight:500; line-height:1.6; opacity:.95;}
  .pop .play .t3{margin-top:8px; font-size:1.1rem; font-weight:900; border:3px solid currentColor; border-radius:999px; padding:.3em 1.1em;}
  .pop .close{min-height:64px; min-width:64px; padding:.4em 1.3em; border-radius:999px; border:4px solid #fff;
       background:#111; color:#fff; font-weight:900; font-size:1.1rem; cursor:pointer;}
  html[data-hc="on"] .pop .close{border-color:#ffe600; color:#ffe600; background:#000;}
  @media (max-width:640px){ .pop .play .t1{font-size:1.8rem;} .pop .play .ic{font-size:4.2rem;} }

  footer{border-top:6px solid var(--ink); background:var(--panel);}
  footer .wrap{padding-top:24px; padding-bottom:30px; font-size:.9rem; line-height:1.9;}
  footer b{font-size:1rem;}

  @media (max-width:640px){
    html{font-size:calc(19px * var(--scale));}
    .mast h1{font-size:2rem;} .mast .date{margin-left:0; width:100%;}
    .tools .grp + .grp{margin-left:0;}
    .tools .wrap{gap:8px; padding-top:8px; padding-bottom:8px;}
    .tools .btn{min-height:46px; font-size:.85rem; padding:.3em .7em;}
    header.mast .wrap{padding-top:14px; padding-bottom:10px; gap:2px 12px;}
    .mast .slogan, .mast .date{font-size:.9rem;}
    nav.secs ul{gap:8px; padding:10px 0;}
    nav.secs .btn{min-height:46px; font-size:.9rem; padding:.25em .75em;}
    .lead{padding:18px 16px 18px;} .lead h2{font-size:1.55rem;}
    .item h3{font-size:1.25rem;} #detail h2{font-size:1.6rem;}
    .acts .btn, #detail .top .btn{flex:1 1 auto;}
  }
</style>
</head>
<body>
<a class="skip" href="#main">본문 바로가기</a>

<div class="tools" role="region" aria-label="보기 도구">
  <div class="wrap">
    <div class="grp" role="group" aria-label="글자 크기">
      <span class="label" aria-hidden="true">글자</span>
      <button class="btn" data-scale="1" aria-pressed="true">보통</button>
      <button class="btn" data-scale="1.2" aria-pressed="false">크게</button>
      <button class="btn" data-scale="1.45" aria-pressed="false">아주 크게</button>
    </div>
    <div class="grp">
      <button class="btn" id="hcBtn" aria-pressed="false">고대비</button>
      <button class="btn solid" id="listenBtn">🔊 신문 듣기</button>
    </div>
  </div>
</div>

<header class="mast">
  <div class="wrap">
    <h1><a href="#" id="home">국제 장애인신문</a></h1>
    <span class="slogan">모두가 읽고, 보고, 듣는 뉴스</span>
    <span class="date" id="today"></span>
  </div>
</header>

<nav class="secs" aria-label="분야">
  <div class="wrap"><ul id="nav"></ul></div>
</nav>

<main id="main" tabindex="-1">
  <div class="wrap" id="view"><p class="empty">신문을 불러오는 중입니다…</p></div>
</main>

<div class="sr" aria-live="polite" id="announce"></div>

<div class="pop" id="pop" role="dialog" aria-modal="true" aria-labelledby="popT1" aria-describedby="popT2">
  <button class="play" id="popPlay" type="button">
    <span class="ic" aria-hidden="true">🔊</span>
    <span class="t1" id="popT1">오늘 신문 전체 듣기</span>
    <span class="t2" id="popT2">화면 어디를 눌러도 오늘 신문을 처음부터 끝까지 소리로 읽어 드립니다.</span>
    <span class="t3" aria-hidden="true">눌러서 듣기</span>
  </button>
  <button class="close" id="popClose" type="button" aria-label="닫고 화면으로 신문 보기">✕ 닫고 화면으로 보기</button>
</div>

<div class="playbar" id="playbar" role="region" aria-label="음성 재생">
  <div class="wrap">
    <span class="now" id="playstatus" aria-live="polite">🔊 읽는 중…</span>
    <button class="btn" id="speedBtn">속도: 보통</button>
    <button class="btn stop" id="playstop">◼ 멈추기</button>
  </div>
</div>

<footer>
  <div class="wrap">
    <div><b>국제 장애인신문</b> · 모두가 읽고, 보고, 듣는 뉴스</div>
    <div id="footReg"></div>
    <div>청소년보호책임자: 유선경 · 고객문의: 050-7369-0119</div>
    <div>외부 기사는 사실을 바탕으로 쉬운 말로 다시 쓰고, 출처를 밝힙니다.</div>
    <div><a href="./listen.html">시각장애인 전용 듣기 페이지 →</a></div>
  </div>
</footer>

<script>
/* ───── 설정 ───── */
const SECTIONS = ["전체","복지·장애","사회","정치","국제","경제","문화","사설","독자 기사"];
const CAT = { // [색, 아이콘]
  "복지·장애":["#0b6b55","♿"], "사회":["#1f4fa3","🏘"], "정치":["#4a4f5e","🏛"], "국제":["#8a3b10","🌏"],
  "경제":["#8a5300","📈"], "문화":["#5d3591","🎭"], "사설":["#0a3a8c","✒"], "독자 기사":["#a3202c","✉"]
};
const col = c => (CAT[c]||["#333"])[0];
const ico = c => (CAT[c]||["",""])[1];
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const store = { get(k){ try{return localStorage.getItem(k);}catch(e){return null;} }, set(k,v){ try{localStorage.setItem(k,v);}catch(e){} } };

let EDITION = { regNo:"", articles:[], ads:null };
let section = "전체";

/* ───── 화면 그리기 ───── */
function tagHTML(a){ return `<span class="tag" style="--c:${col(a.category)}"><span aria-hidden="true">${ico(a.category)} </span>${esc(a.category)}</span>`; }
function byline(a){
  const who = a.type==="column" ? (a.author||"AI 논설위원") : (a.source ? "출처: "+a.source : (a.author||""));
  return esc(who);
}
function safeUrl(u){ return /^https:\/\//.test(String(u||"")) ? u : ""; }
function photoHTML(a, eager){
  const src = safeUrl(a.image); if(!src) return "";
  const alt = a.imageAlt || (a.category+" 관련 자료 사진");
  const cu = safeUrl(a.imageCreditUrl);
  const credit = a.imageCredit ? (cu ? `<a href="${esc(cu)}" target="_blank" rel="noopener noreferrer">${esc(a.imageCredit)}</a>` : esc(a.imageCredit)) : "";
  return `<figure class="ph"><img src="${esc(src)}" alt="${esc(alt)}" ${eager?'':'loading="lazy"'} decoding="async"
      onerror="this.closest('figure').remove()"><figcaption>자료 사진${credit?" · "+credit:""}</figcaption></figure>`;
}
function renderNav(){
  document.getElementById("nav").innerHTML = SECTIONS.map(s => {
    const n = s==="전체" ? EDITION.articles.length : EDITION.articles.filter(a=>a.category===s).length;
    if (s!=="전체" && !n) return "";
    return `<li><button class="btn" data-sec="${esc(s)}" ${s===section?'aria-current="page"':''}>${esc(s)} <span class="sr">${n}건</span></button></li>`;
  }).join("");
}
function adHTML(ad){
  if(!ad) return "";
  return `<aside class="ad" aria-label="광고"><span class="lab">광고</span><b>${esc(ad.text)}</b><span class="who">${esc(ad.advertiser)}</span></aside>`;
}
function itemHTML(a, i, total){
  const isCol = a.type==="column";
  const ph = photoHTML(a, false);
  return `<li class="item${isCol?' column':''}" data-id="${esc(a.id)}" style="--c:${col(a.category)}">
      <div class="grid${ph?'':' noimg'}">${ph}<div>
      <div class="kicker">${tagHTML(a)}<span class="num">${i} / ${total}</span></div>
      <h3><a href="#a/${encodeURIComponent(a.id)}">${esc(a.headline)}</a></h3>
      ${a.dek?`<p class="dek">${esc(a.dek)}</p>`:""}
      <div class="src">${byline(a)}</div>
      <div class="acts">
        <a class="btn" href="#a/${encodeURIComponent(a.id)}" aria-label="${esc(a.headline)} 본문 읽기">본문 읽기 →</a>
        <button class="btn" data-listen="${esc(a.id)}" aria-label="${esc(a.headline)} 소리로 듣기">🔊 듣기</button>
      </div>
      </div></div>
    </li>`;
}
function listHTML(){
  const arts = EDITION.articles;
  if(!arts.length) return `<p class="empty">오늘 신문을 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.</p>`;
  const all = section==="전체";
  const vis = all ? arts : arts.filter(a=>a.category===section);
  if(!vis.length) return `<p class="empty">이 분야의 기사가 오늘은 없습니다.</p>`;
  const A = EDITION.ads||{};
  let html = "";
  let rest = vis;
  if(all){
    const L = vis[0]; rest = vis.slice(1);
    html += `<section class="lead" data-id="${esc(L.id)}" style="--c:${col(L.category)}" aria-labelledby="leadh">
      <div class="inner"><div class="grid${safeUrl(L.image)?'':' noimg'}">${photoHTML(L, true)}<div>
        <div class="kicker"><b>오늘의 머리기사</b>${tagHTML(L)}</div>
        <h2 id="leadh"><a href="#a/${encodeURIComponent(L.id)}">${esc(L.headline)}</a></h2>
        ${L.dek?`<p class="dek">${esc(L.dek)}</p>`:""}
        <div class="src">${byline(L)}</div>
        <div class="acts">
          <a class="btn solid" href="#a/${encodeURIComponent(L.id)}">본문 읽기 →</a>
          <button class="btn" data-listen="${esc(L.id)}">🔊 이 기사 듣기</button>
        </div>
      </div></div></div></section>
      <div class="listenall"><p>오늘 신문 <b>${arts.length}건</b>을 처음부터 끝까지 소리로 읽어 드립니다.</p>
        <button class="btn solid" data-listen-all>🔊 오늘 신문 전체 듣기</button></div>
      ${adHTML(A.leader)}`;
  } else {
    html += `<h2 style="font-size:1.6rem;margin:4px 0 6px">${esc(section)} <span class="num">${vis.length}건</span></h2>`;
  }
  const startNo = all ? 2 : 1, total = vis.length;
  const items = rest.map((a,k)=> itemHTML(a, startNo+k, total) + (all && k===4 && A.rect ? `<li style="list-style:none">${adHTML(A.rect)}</li>` : ""));
  html += `<ol class="list" aria-label="기사 목록">${items.join("")}</ol>`;
  return html;
}
function detailHTML(a){
  const arts = EDITION.articles, i = arts.indexOf(a);
  const prev = arts[i-1], next = arts[i+1];
  const orig = a.url && a.url!=="#" ? `<p class="orig">이 기사는 <b>${esc(a.source||"")}</b> 보도의 사실을 바탕으로 쉬운 말로 다시 썼습니다. <a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">원문 기사 보기 (새 창)</a></p>` : "";
  return `<article id="detail" data-id="${esc(a.id)}" style="--c:${col(a.category)}">
      <div class="top">
        <a class="btn" href="#">← 목록으로</a>
        <button class="btn solid" data-listen="${esc(a.id)}">🔊 이 기사 듣기</button>
      </div>
      <div class="kicker">${tagHTML(a)}<span class="num">${i+1} / ${arts.length}</span></div>
      <h2 tabindex="-1" id="dh">${esc(a.headline)}</h2>
      <div class="src">${byline(a)}</div>
      ${photoHTML(a, true)}
      ${a.dek?`<p class="dek">${esc(a.dek)}</p>`:""}
      <div class="body">${String(a.body||"").split(/\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join("")}</div>
      ${orig}
      <nav class="pager" aria-label="다른 기사">
        ${prev?`<a class="btn" href="#a/${encodeURIComponent(prev.id)}">← 이전 기사<br>${esc(prev.headline)}</a>`:""}
        ${next?`<a class="btn" href="#a/${encodeURIComponent(next.id)}">다음 기사 →<br>${esc(next.headline)}</a>`:""}
      </nav>
    </article>`;
}
function say(t){ const el=document.getElementById("announce"); el.textContent=""; setTimeout(()=>el.textContent=t,50); }
function route(){
  stopRead();
  const v = document.getElementById("view");
  const m = location.hash.match(/^#a\/(.+)$/);
  const a = m && EDITION.articles.find(x=>x.id===decodeURIComponent(m[1]));
  if(a){
    v.innerHTML = detailHTML(a); window.scrollTo(0,0);
    const h=document.getElementById("dh"); if(h) h.focus({preventScroll:true});
    document.title = a.headline+" — 국제 장애인신문";
  } else {
    v.innerHTML = listHTML();
    document.title = "국제 장애인신문 — 모두가 읽고, 보고, 듣는 뉴스";
  }
}
function renderTop(){
  document.getElementById("today").textContent =
    new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
  document.getElementById("footReg").textContent = EDITION.regNo||"";
}

/* ───── 소리로 읽기 ───── */
const synthOK = "speechSynthesis" in window;
const SPEEDS = [[0.8,"느리게"],[1,"보통"],[1.2,"빠르게"]];
let speedI = Number(store.get("idn_speed")||1); if(!(speedI>=0&&speedI<3)) speedI=1;
let segs=[], idx=0, playing=false;
function sentences(t){ return String(t||"").split(/\n+/).flatMap(l=>l.match(/[^.!?。…]+[.!?。…]?/g)||[]).map(s=>s.trim()).filter(Boolean); }
function mark(id){ document.querySelectorAll("[data-id]").forEach(el=>el.classList.toggle("reading", !!id && el.dataset.id===id)); }
function step(){
  if(idx>=segs.length){ stopRead(); return; }
  const s = segs[idx]; mark(s.aid);
  if(s.label) document.getElementById("playstatus").textContent = "🔊 "+s.label;
  const u = new SpeechSynthesisUtterance(s.text); u.lang="ko-KR"; u.rate=SPEEDS[speedI][0];
  u.onend=()=>{ if(playing){ idx++; step(); } }; u.onerror=u.onend;
  speechSynthesis.speak(u);
}
function start(list){
  if(!synthOK){ alertNoTTS(); return; }
  if(!list.length) return;
  speechSynthesis.cancel(); segs=list; idx=0; playing=true;
  document.getElementById("playbar").classList.add("on");
  document.getElementById("listenBtn").textContent="◼ 듣기 멈추기";
  step();
}
function alertNoTTS(){ say("이 브라우저에서는 음성 듣기를 쓸 수 없습니다."); document.getElementById("playstatus").textContent="이 브라우저에서는 음성 듣기를 쓸 수 없습니다."; document.getElementById("playbar").classList.add("on"); }
function segsFor(a){
  const label = a.headline.length>28 ? a.headline.slice(0,28)+"…" : a.headline;
  return sentences(`${a.category}. ${a.headline}. ${a.body||a.dek}`).map((t,k)=>({text:t, aid:a.id, label:k===0?label:null}));
}
function playAll(){
  const list = sentences("국제 장애인신문, 오늘자 신문을 읽어 드립니다.").map(t=>({text:t,aid:null,label:"오늘 신문 전체"}));
  EDITION.articles.forEach(a=>list.push(...segsFor(a)));
  start(list);
}
function playOne(id){ const a=EDITION.articles.find(x=>x.id===id); if(a) start(segsFor(a)); }
function stopRead(){
  if(synthOK) speechSynthesis.cancel(); playing=false; segs=[]; idx=0;
  const pb=document.getElementById("playbar"); if(pb) pb.classList.remove("on");
  const lb=document.getElementById("listenBtn"); if(lb) lb.textContent="🔊 신문 듣기";
  mark(null);
}

/* ───── 보기 설정 (기억해 둠) ───── */
function setScale(v){
  document.documentElement.style.setProperty("--scale", v);
  document.querySelectorAll("[data-scale]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.scale===String(v))));
  store.set("idn_scale", v);
}
function setHC(on){
  document.documentElement.setAttribute("data-hc", on?"on":"off");
  document.getElementById("hcBtn").setAttribute("aria-pressed", String(on));
  store.set("idn_hc", on?"on":"off");
}
function setSpeedLabel(){ document.getElementById("speedBtn").textContent = "속도: "+SPEEDS[speedI][1]; }

/* ───── 이벤트 ───── */
/* ───── 첫 화면 팝업 ───── */
let lastFocus = null;
function openPop(){
  const p = document.getElementById("pop"); if(!p) return;
  lastFocus = document.activeElement;
  p.classList.add("on"); document.body.style.overflow="hidden";
  setTimeout(()=>document.getElementById("popPlay").focus(), 50);
}
function closePop(){
  const p = document.getElementById("pop"); if(!p || !p.classList.contains("on")) return;
  p.classList.remove("on"); document.body.style.overflow="";
  const m = document.getElementById("main"); if(m) m.focus({preventScroll:true});
}
document.getElementById("pop").addEventListener("click", e=>{
  e.stopPropagation();
  if(e.target.closest("#popClose")){ closePop(); return; }   // ✕ : 닫기만
  closePop(); playAll();                                     // 그 밖 어디든 : 전체 듣기
});
document.getElementById("pop").addEventListener("keydown", e=>{
  if(e.key==="Escape"){ e.preventDefault(); closePop(); return; }
  if(e.key==="Tab"){ // 팝업 안에서만 이동
    const a=document.getElementById("popPlay"), b=document.getElementById("popClose");
    if(e.shiftKey && document.activeElement===a){ e.preventDefault(); b.focus(); }
    else if(!e.shiftKey && document.activeElement===b){ e.preventDefault(); a.focus(); }
  }
});

document.addEventListener("click", e=>{
  const t = e.target;
  if(t.closest("#playstop")){ stopRead(); return; }
  if(t.closest("#speedBtn")){ speedI=(speedI+1)%3; store.set("idn_speed",speedI); setSpeedLabel();
    if(playing){ speechSynthesis.cancel(); playing=true; step(); } return; }
  if(t.closest("#listenBtn") || t.closest("[data-listen-all]")){ playing ? stopRead() : playAll(); return; }
  const l = t.closest("[data-listen]"); if(l){ playOne(l.dataset.listen); return; }
  const s = t.closest("[data-sec]"); if(s){ section=s.dataset.sec; renderNav();
    if(location.hash){ history.pushState(null,"",location.pathname); } route();
    say(section+" 기사를 보여 드립니다."); document.getElementById("main").focus({preventScroll:true}); window.scrollTo(0,0); return; }
  if(t.closest("#home")){ e.preventDefault(); section="전체"; renderNav(); history.pushState(null,"",location.pathname); route(); return; }
  const sc = t.closest("[data-scale]"); if(sc){ setScale(sc.dataset.scale); return; }
  if(t.closest("#hcBtn")){ setHC(document.documentElement.getAttribute("data-hc")!=="on"); return; }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && playing) stopRead(); });
window.addEventListener("hashchange", route);
window.addEventListener("popstate", route);

/* ───── 시작 ───── */
(async function(){
  const sc = store.get("idn_scale"); if(sc) setScale(sc);
  if(store.get("idn_hc")==="on") setHC(true);
  setSpeedLabel();
  try{ const r = await fetch("./articles.json?t="+Date.now(),{cache:"no-store"}); if(r.ok){ const d=await r.json(); if(d && Array.isArray(d.articles)) EDITION=d; } }catch(e){}
  renderTop(); renderNav(); route();
  // 첫 화면(목록)으로 들어왔고 기사가 있으면 팝업을 띄움. 기사 링크로 바로 들어온 경우는 띄우지 않음.
  if(!/^#a\//.test(location.hash) && EDITION.articles.length) openPop();
})();
</script>
</body>
</html>
